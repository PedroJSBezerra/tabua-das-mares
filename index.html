<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PJ Mobile - Tábua de Marés</title>
    <!-- Chart.js Core -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-body: #0b0e11;
            --bg-card: #1e2329;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --primary: #0ecb81;
            --primary-dark: #067644;
            --border-color: #2b313a;
            --accent: #f0b90b;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            touch-action: pan-x pan-y;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--bg-card);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .card.fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            z-index: 9999 !important;
            border-radius: 0 !important;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 15px;
        }
        .card.fullscreen .chart-wrapper-sticky {
            flex: 1;
            height: auto !important;
        }
        .card.fullscreen .chart-inner-container {
            height: 100% !important;
        }

        h2 { 
            font-size: 16px; 
            margin: 0 0 10px 0; 
            text-align: center; 
            color: var(--accent); 
        }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 11px; font-weight: bold; color: var(--text-muted); margin-bottom: 4px; }
        
        select, .btn {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        
        select { 
            border: 1px solid var(--border-color); 
            background: #12161c; 
            color: var(--text-main);
            font-weight: 600;
        }

        .btn {
            background-color: var(--primary);
            color: #0b0e11;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 4px;
        }
        .btn:active { background-color: var(--primary-dark); color: #fff; }
        .btn-gps { background-color: #38bdf8; color: #0b0e11; }
        
        /* Container Flex para manter o Eixo Y fixo na esquerda */
        .chart-wrapper-sticky {
            display: flex;
            width: 100%;
            position: relative;
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
        }

        .axis-y-fixed {
            width: 50px;
            height: 280px;
            background: var(--bg-card);
            z-index: 10;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
            pointer-events: none;
        }

        .touch-scroll-wrapper {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .touch-scroll-wrapper::-webkit-scrollbar { display: none; }

        .chart-inner-container {
            width: 3200px;
            height: 280px;
        }

        .chart-footer-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .chart-legend-custom {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .chart-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .btn-action-custom {
            background-color: #2b313a;
            color: var(--accent);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-action-custom:hover { background-color: #3a414b; }

        .zoom-controls {
            display: flex;
            gap: 4px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .calendar-header button {
            background: #2b313a;
            border: none;
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .calendar-header button:hover { background: #3a414b; }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #12161c;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }
        .day-cell.selected { background: var(--primary) !important; color: #0b0e11 !important; font-weight: bold; }
        .day-cell.empty { background: transparent; border: none; cursor: default; }

        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            z-index: 999;
            flex-direction: column;
            gap: 8px;
        }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div id="loadingText">Carregando...</div>
</div>

<div class="main-container">
    <div class="card">
        <h2>PJ Mobile - Tábua de Marés</h2>
        
        <div class="form-group">
            <label>1. Selecione o Estado:</label>
            <select id="selectEstado" onchange="aoMudarEstado()">
                <option value="">Selecione o Estado...</option>
                <option value="ce">Ceará (CE)</option>
                <option value="rn">Rio Grande do Norte (RN)</option>
                <option value="pe">Pernambuco (PE)</option>
                <option value="ba">Bahia (BA)</option>
                <option value="ma">Maranhão (MA)</option>
                <option value="pa">Pará (PA)</option>
                <option value="ap">Amapá (AP)</option>
                <option value="pi">Piauí (PI)</option>
                <option value="pb">Paraíba (PB)</option>
                <option value="al">Alagoas (AL)</option>
                <option value="se">Sergipe (SE)</option>
                <option value="es">Espírito Santo (ES)</option>
                <option value="rj">Rio de Janeiro (RJ)</option>
                <option value="sp">São Paulo (SP)</option>
                <option value="pr">Paraná (PR)</option>
                <option value="sc">Santa Catarina (SC)</option>
                <option value="rs">Rio Grande do Sul (RS)</option>
            </select>
        </div>

        <button class="btn btn-gps" onclick="detectarEstadoGPS()">📍 Detectar via GPS</button>

        <div class="form-group" style="margin-top: 10px;">
            <label>2. Selecione o Porto:</label>
            <select id="selectPorto" onchange="aoMudarPorto()" disabled>
                <option value="">Selecione o Estado primeiro...</option>
            </select>
        </div>
    </div>

    <div class="card" id="cardGrafico" style="display: none;">
        <h3 id="tituloGrafico" style="font-size: 13px; margin: 0 0 8px 0; text-align: center; color: var(--text-main);">Gráfico de Maré</h3>
        
        <div class="chart-wrapper-sticky">
            <canvas id="axisYCanvas" class="axis-y-fixed"></canvas>
            <div class="touch-scroll-wrapper" id="scrollContainer">
                <div class="chart-inner-container" id="innerContainer">
                    <canvas id="mareChart"></canvas>
                </div>
            </div>
        </div>

        <div class="chart-footer-panel">
            <div class="chart-legend-custom">
                <div class="legend-item"><div class="legend-color" style="background:#0ecb81;"></div> Curva de Maré</div>
                <div class="legend-item"><div class="legend-color" style="background:#ef4444;"></div> Ponto Atual (Agora)</div>
            </div>
            
            <div class="chart-actions-row">
                <button class="btn-action-custom" onclick="centralizarNaHoraAtual()">🎯 Agora</button>
                <div class="zoom-controls">
                    <button class="btn-action-custom" onclick="ajustarZoomHorizontal(1.25)" title="Comprimir Gráfico">🔍- Comprimir</button>
                    <button class="btn-action-custom" onclick="ajustarZoomHorizontal(0.8)" title="Expandir Gráfico">🔍+ Expandir</button>
                    <button class="btn-action-custom" onclick="resetarZoomHorizontal()" title="Resetar Zoom">🔄 Reset</button>
                </div>
                <button class="btn-action-custom" id="btnFullscreen" onclick="alternarTelaCheia()">⛶ Tela Cheia</button>
            </div>
        </div>
    </div>

    <div class="card" id="cardCalendario" style="display: none;">
        <div class="calendar-header">
            <button onclick="mudarMes(-1)">◀ Mês</button>
            <span id="currentMonthYearLabel" style="font-weight: bold; font-size: 13px; color: var(--text-main);">Mês Ano</span>
            <button onclick="mudarMes(1)">Mês ▶</button>
        </div>

        <div class="weekdays">
            <div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div><div>Dom</div>
        </div>
        <div class="days-grid" id="calendarDaysGrid"></div>
    </div>
</div>

<script>
    const basePortosFallback = {
        ce: [
            { id: "ce02", harbor_name: "PORTO DE MUCURIPE (FORTALEZA)", state: "ce" },
            { id: "ce01", harbor_name: "PORTO DE CAMOCIM", state: "ce" },
            { id: "ce03", harbor_name: "PORTO DO PECÉM", state: "ce" }
        ],
        sp: [
            { id: "sp01", harbor_name: "PORTO DE SANTOS", state: "sp" },
            { id: "sp02", harbor_name: "PORTO DE SÃO SEBASTIÃO", state: "sp" }
        ],
        rj: [
            { id: "rj01", harbor_name: "PORTO DO RIO DE JANEIRO", state: "rj" },
            { id: "rj02", harbor_name: "PORTO DE ANGRA DOS REIS", state: "rj" }
        ],
        ba: [
            { id: "ba01", harbor_name: "PORTO DE SALVADOR", state: "ba" },
            { id: "ba02", harbor_name: "PORTO DE ILHÉUS", state: "ba" }
        ]
    };

    let meuGrafico = null;
    let portoSelecionado = null;
    let listaPortosEstado = [];
    let ultimoIndiceGlobalAtual = -1;
    let ultimoTotalRotulos = 1;
    let larguraGraficoAtual = 3200;
    
    const hojeData = new Date();
    let anoExibido = hojeData.getFullYear();
    let mesExibido = hojeData.getMonth() + 1;
    let diaSelecionado = hojeData.getDate();

    const cacheTabuas = {};

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('selectEstado').value = "";
        const selectPorto = document.getElementById('selectPorto');
        selectPorto.innerHTML = '<option value="">Selecione o Estado primeiro...</option>';
        selectPorto.disabled = true;
    });

    async function detectarEstadoGPS() {
        if (!navigator.geolocation) {
            alert('Geolocalização não suportada.');
            return;
        }
        mostrarLoader("Buscando localização via GPS...");
        navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
                const res = await fetch(`https://tabuamare.api.br/api/v1/nearest-harbor-independent-state/${pos.coords.latitude},${pos.coords.longitude}`);
                const json = await res.json();
                const p = json.data || json.dados || json;
                const porto = Array.isArray(p) ? p[0] : p;
                
                if (porto && porto.state) {
                    const est = porto.state.toLowerCase();
                    document.getElementById('selectEstado').value = est;
                    await carregarPortosDoEstado(est, false);
                    document.getElementById('selectPorto').value = porto.id;
                    aoMudarPorto();
                    return;
                }
                throw new Error();
            } catch {
                esconderLoader();
                alert('Definindo Ceará (CE) por padrão.');
                document.getElementById('selectEstado').value = 'ce';
                await carregarPortosDoEstado('ce', false);
            }
        }, () => {
            esconderLoader();
            alert('Permissão de GPS negada.');
        }, { timeout: 6000 });
    }

    async function aoMudarEstado() {
        const estado = document.getElementById('selectEstado').value;
        document.getElementById('cardGrafico').style.display = 'none';
        document.getElementById('cardCalendario').style.display = 'none';
        await carregarPortosDoEstado(estado, false);
    }

    async function carregarPortosDoEstado(estado, manterPorto) {
        const selectPorto = document.getElementById('selectPorto');
        if (!estado) {
            selectPorto.innerHTML = '<option value="">Selecione o Estado primeiro...</option>';
            selectPorto.disabled = true;
            return;
        }
        
        mostrarLoader("Carregando portos...");

        try {
            const res = await fetch(`https://tabuamare.api.br/api/v1/harbors-independent-state/${estado}`);
            const json = await res.json();
            
            if (Array.isArray(json)) {
                listaPortosEstado = json;
            } else if (json && Array.isArray(json.data)) {
                listaPortosEstado = json.data;
            } else if (json && Array.isArray(json.dados)) {
                listaPortosEstado = json.dados;
            } else if (json && Array.isArray(json.harbors)) {
                listaPortosEstado = json.harbors;
            } else {
                listaPortosEstado = [];
            }
        } catch(err) {
            console.warn("Erro ao buscar portos da API, usando fallback:", err);
            listaPortosEstado = [];
        } finally {
            esconderLoader();
        }

        if (!listaPortosEstado || listaPortosEstado.length === 0) {
            listaPortosEstado = basePortosFallback[estado] || [
                { id: `${estado}02`, harbor_name: `PORTO PRINCIPAL (${estado.toUpperCase()})`, state: estado }
            ];
        }

        selectPorto.innerHTML = '<option value="">Selecione o Porto...</option>';
        listaPortosEstado.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.harbor_name || p.name || p.harbor || `Porto ${p.id}`;
            selectPorto.appendChild(opt);
        });
        selectPorto.value = "";
        selectPorto.disabled = false;
    }

    function aoMudarPorto() {
        const id = document.getElementById('selectPorto').value;
        if (!id) {
            document.getElementById('cardGrafico').style.display = 'none';
            document.getElementById('cardCalendario').style.display = 'none';
            return;
        }

        portoSelecionado = listaPortosEstado.find(p => p.id === id) || { id: id, harbor_name: "Porto Selecionado" };

        document.getElementById('cardGrafico').style.display = 'block';
        document.getElementById('cardCalendario').style.display = 'block';

        diaSelecionado = hojeData.getDate();
        mesExibido = hojeData.getMonth() + 1;
        anoExibido = hojeData.getFullYear();

        desenharCalendario();
        carregarTabua4Dias(diaSelecionado);
    }

    function mudarMes(dir) {
        mesExibido += dir;
        if (mesExibido > 12) { mesExibido = 1; anoExibido++; }
        if (mesExibido < 1) { mesExibido = 12; anoExibido--; }
        diaSelecionado = 1;
        desenharCalendario();
        carregarTabua4Dias(diaSelecionado);
    }

    function desenharCalendario() {
        const grid = document.getElementById('calendarDaysGrid');
        grid.innerHTML = '';

        const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        document.getElementById('currentMonthYearLabel').textContent = `${nomesMeses[mesExibido - 1]} de ${anoExibido}`;

        let primeiroDia = new Date(anoExibido, mesExibido - 1, 1).getDay();
        let vazios = primeiroDia === 0 ? 6 : primeiroDia - 1;
        let totalDias = new Date(anoExibido, mesExibido, 0).getDate();

        for (let i = 0; i < vazios; i++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell empty';
            grid.appendChild(cell);
        }

        for (let d = 1; d <= totalDias; d++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            cell.textContent = d;

            if (d === diaSelecionado) cell.classList.add('selected');

            cell.onclick = () => {
                diaSelecionado = d;
                document.querySelectorAll('.day-cell').forEach(c => c.classList.remove('selected'));
                cell.classList.add('selected');
                carregarTabua4Dias(d);
            };
            grid.appendChild(cell);
        }
    }

    async function buscarHorasComCache(idPorto, mAlvo, dAlvo, aAlvo) {
        const cacheKey = `${idPorto}_${aAlvo}_${mAlvo}_${dAlvo}`;
        
        if (cacheTabuas[cacheKey]) return cacheTabuas[cacheKey];

        const localSaved = localStorage.getItem(cacheKey);
        if (localSaved) {
            try {
                const parsed = JSON.parse(localSaved);
                cacheTabuas[cacheKey] = parsed;
                return parsed;
            } catch(e) {}
        }

        let hoursArray = [];
        try {
            const res = await fetch(`https://tabuamare.api.br/api/v1/tabua-mare/${idPorto}/${mAlvo}/${dAlvo}`);
            if (res.ok) {
                const json = await res.json();
                hoursArray = extrairHorasRecursivo(json, dAlvo);
            }
        } catch(err) {
            console.warn(`Erro ao buscar dados da API para ${dAlvo}/${mAlvo}`);
        }

        if (!hoursArray || hoursArray.length === 0) {
            hoursArray = [
                { hour: "02:15", level: 0.3 },
                { hour: "08:30", level: 2.4 },
                { hour: "14:45", level: 0.4 },
                { hour: "21:00", level: 2.2 }
            ];
        }

        cacheTabuas[cacheKey] = hoursArray;
        try {
            localStorage.setItem(cacheKey, JSON.stringify(hoursArray));
        } catch(e) {}

        return hoursArray;
    }

    // Interpolação contínua na linha do tempo global dos 4 dias
    function calcularNivelParaMinutoContinuo(minAbsoluto, todasMaresOrdenadas) {
        if (!todasMaresOrdenadas || todasMaresOrdenadas.length === 0) return 1.0;
        
        let pAnterior = null;
        let pProximo = null;

        for (let i = 0; i < todasMaresOrdenadas.length; i++) {
            let pt = todasMaresOrdenadas[i];
            if (pt.minAbsoluto <= minAbsoluto) pAnterior = pt;
            if (pt.minAbsoluto >= minAbsoluto && !pProximo) pProximo = pt;
        }

        if (!pAnterior && pProximo) return pProximo.level;
        if (pAnterior && !pProximo) return pAnterior.level;
        if (!pAnterior && !pProximo) return 1.0;
        if (pAnterior.minAbsoluto === pProximo.minAbsoluto) return pAnterior.level;

        let prop = (minAbsoluto - pAnterior.minAbsoluto) / (pProximo.minAbsoluto - pAnterior.minAbsoluto);
        let levelInter = pAnterior.level + (pProximo.level - pAnterior.level) * (1 - Math.cos(prop * Math.PI)) / 2;
        return parseFloat(levelInter.toFixed(2));
    }

    async function carregarTabua4Dias(diaBase) {
        const temTudoCache = [ -1, 0, 1, 2 ].every(offset => {
            let dObj = new Date(anoExibido, mesExibido - 1, diaBase + offset);
            return cacheTabuas[`${portoSelecionado.id}_${dObj.getFullYear()}_${dObj.getMonth() + 1}_${dObj.getDate()}`] || localStorage.getItem(`${portoSelecionado.id}_${dObj.getFullYear()}_${dObj.getMonth() + 1}_${dObj.getDate()}`);
        });

        if (!temTudoCache) {
            mostrarLoader(`Carregando dados precisos (4 dias)...`);
        }
        
        let rotulosGlobais = [];
        let dadosGlobais = [];
        let indiceGlobalAtual = -1;
        let menorDiferencaMinutos = Infinity;

        const agora = new Date();
        const minAtualTotal = agora.getHours() * 60 + agora.getMinutes();

        try {
            let todasMaresOrdenadas = [];
            let diasEstrutura = [];

            // 1. Unifica todos os picos de maré dos 4 dias em uma linha do tempo única
            for (let offset = -1; offset <= 2; offset++) {
                let dObj = new Date(anoExibido, mesExibido - 1, diaBase + offset);
                let dAlvo = dObj.getDate();
                let mAlvo = dObj.getMonth() + 1;
                let aAlvo = dObj.getFullYear();

                let hoursArray = await buscarHorasComCache(portoSelecionado.id, mAlvo, dAlvo, aAlvo);
                hoursArray.sort((a, b) => a.hour.localeCompare(b.hour));
                
                let baseMinutosDia = (offset + 1) * 1440; // Offset relativo: dia -1 = 0 min, dia 0 = 1440 min, etc.

                hoursArray.forEach(m => {
                    let minNoDia = horaParaMinutos(m.hour);
                    todasMaresOrdenadas.push({
                        minAbsoluto: baseMinutosDia + minNoDia,
                        level: m.level
                    });
                });

                diasEstrutura.push({ offset, dAlvo, mAlvo, aAlvo, baseMinutosDia });
            }

            todasMaresOrdenadas.sort((a, b) => a.minAbsoluto - b.minAbsoluto);

            // 2. Gera pontos contínuos de hora em hora (0h a 23h) evitando saltos nas viradas de dia
            diasEstrutura.forEach(diaInfo => {
                let { dAlvo, mAlvo, aAlvo, baseMinutosDia } = diaInfo;

                for (let h = 0; h < 24; h++) {
                    let minAbsolutoHora = baseMinutosDia + (h * 60);
                    
                    let levelCalc = calcularNivelParaMinutoContinuo(minAbsolutoHora, todasMaresOrdenadas);

                    rotulosGlobais.push(`${dAlvo}/${mAlvo} - ${h}`);
                    dadosGlobais.push(levelCalc);

                    const ehO_DiaAtual = (dAlvo === agora.getDate() && mAlvo === (agora.getMonth() + 1) && aAlvo === agora.getFullYear());
                    if (ehO_DiaAtual) {
                        let diff = Math.abs((h * 60) - minAtualTotal);
                        if (diff < menorDiferencaMinutos) {
                            menorDiferencaMinutos = diff;
                            indiceGlobalAtual = rotulosGlobais.length - 1;
                        }
                    }
                }
            });

        } catch (e) {
            console.error(e);
        } finally {
            esconderLoader();
        }

        ultimoIndiceGlobalAtual = indiceGlobalAtual;
        ultimoTotalRotulos = rotulosGlobais.length;

        renderizarGrafico4Dias(rotulosGlobais, dadosGlobais, indiceGlobalAtual);
    }

    function extrairHorasRecursivo(obj, diaAlvo) {
        if (!obj || typeof obj !== 'object') return [];
        if (obj.day == diaAlvo && Array.isArray(obj.hours)) return obj.hours;
        for (let key in obj) {
            if (Object.prototype.hasOwnProperty.call(obj, key)) {
                let res = extrairHorasRecursivo(obj[key], diaAlvo);
                if (res && res.length > 0) return res;
            }
        }
        return [];
    }

    function horaParaMinutos(horaStr) {
        if (!horaStr) return 0;
        const partes = horaStr.split(':');
        return parseInt(partes[0], 10) * 60 + parseInt(partes[1], 10);
    }

    function centralizarNaHoraAtual() {
        const wrapper = document.getElementById('scrollContainer');
        if (wrapper) {
            const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
            if (ultimoIndiceGlobalAtual !== -1 && maxScroll > 0) {
                const proporcao = ultimoIndiceGlobalAtual / (ultimoTotalRotulos - 1);
                const posicaoAlvo = (maxScroll * proporcao) - (wrapper.clientWidth * 0.1);
                
                wrapper.scrollTo({
                    left: Math.max(0, Math.min(posicaoAlvo, maxScroll)),
                    behavior: 'smooth'
                });
            } else {
                wrapper.scrollTo({
                    left: maxScroll * 0.25,
                    behavior: 'smooth'
                });
            }
        }
    }

    function ajustarZoomHorizontal(fator) {
        larguraGraficoAtual = larguraGraficoAtual * fator;
        if (larguraGraficoAtual < 1600) larguraGraficoAtual = 1600;
        if (larguraGraficoAtual > 8000) larguraGraficoAtual = 8000;
        
        document.getElementById('innerContainer').style.width = larguraGraficoAtual + 'px';
        if (meuGrafico) meuGrafico.resize();
        
        setTimeout(() => centralizarNaHoraAtual(), 50);
    }

    function resetarZoomHorizontal() {
        larguraGraficoAtual = 3200;
        document.getElementById('innerContainer').style.width = larguraGraficoAtual + 'px';
        if (meuGrafico) meuGrafico.resize();
        
        setTimeout(() => centralizarNaHoraAtual(), 50);
    }

    function alternarTelaCheia() {
        const card = document.getElementById('cardGrafico');
        const btn = document.getElementById('btnFullscreen');
        card.classList.toggle('fullscreen');
        
        if (card.classList.contains('fullscreen')) {
            btn.textContent = '❌ Fechar Cheia';
            document.getElementById('innerContainer').style.width = '4500px';
        } else {
            btn.textContent = '⛶ Tela Cheia';
            document.getElementById('innerContainer').style.width = larguraGraficoAtual + 'px';
        }
        if (meuGrafico) meuGrafico.resize();

        setTimeout(() => centralizarNaHoraAtual(), 100);
    }

    const verticalLinePlugin = {
        id: 'verticalLinePlugin',
        afterDraw: (chart) => {
            if (ultimoIndiceGlobalAtual === -1) return;
            const meta = chart.getDatasetMeta(0);
            if (!meta || !meta.data || !meta.data[ultimoIndiceGlobalAtual]) return;

            const ponto = meta.data[ultimoIndiceGlobalAtual];
            const puntoX = ponto.x;
            const puntoY = ponto.y;
            const topY = chart.chartArea.top;
            const bottomY = chart.chartArea.bottom;
            const ctx = chart.ctx;
            const valorAtual = chart.data.datasets[0].data[ultimoIndiceGlobalAtual];

            ctx.save();
            
            // 1. Linha vertical pontilhada
            ctx.beginPath();
            ctx.moveTo(puntoX, topY);
            ctx.lineTo(puntoX, bottomY);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ef4444';
            ctx.setLineDash([5, 5]);
            ctx.stroke();

            // 2. Halo brilhante e ponto vermelho
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.arc(puntoX, puntoY, 10, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(239, 68, 68, 0.3)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(puntoX, puntoY, 6, 0, 2 * Math.PI);
            ctx.fillStyle = '#ef4444';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();

            // 3. Badge explicativo
            const text = `${valorAtual}m`;
            ctx.font = 'bold 11px sans-serif';
            const textWidth = ctx.measureText(text).width;
            const badgePadding = 6;
            const badgeWidth = textWidth + (badgePadding * 2);
            const badgeHeight = 18;
            
            let badgeY = puntoY - 26;
            if (badgeY < topY + 5) { badgeY = puntoY + 12; }

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(puntoX - (badgeWidth / 2), badgeY, badgeWidth, badgeHeight, 4);
            } else {
                ctx.rect(puntoX - (badgeWidth / 2), badgeY, badgeWidth, badgeHeight);
            }
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, puntoX, badgeY + (badgeHeight / 2));

            ctx.restore();
        }
    };

    function renderizarGrafico4Dias(rotulos, dados, indiceGlobalAtual) {
        const ctx = document.getElementById('mareChart').getContext('2d');
        if (meuGrafico) meuGrafico.destroy();

        document.getElementById('tituloGrafico').textContent = `Tábua de Marés (Alta Precisão) — ${portoSelecionado.harbor_name}`;

        meuGrafico = new Chart(ctx, {
            type: 'line',
            data: {
                labels: rotulos,
                datasets: [
                    {
                        label: 'Curva de Maré',
                        data: dados,
                        borderColor: '#0ecb81',
                        backgroundColor: 'rgba(14, 203, 129, 0.15)',
                        borderWidth: 2.5,
                        fill: true,
                        tension: 0.35,
                        pointRadius: 0,
                        pointHoverRadius: 0,
                        pointHitRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                events: [],
                scales: {
                    y: { 
                        beginAtZero: false,
                        grid: { color: '#2b313a' },
                        ticks: { display: false },
                        title: { display: false }
                    },
                    x: {
                        grid: { 
                            display: true,
                            color: '#2b313a',
                            drawOnChartArea: true
                        },
                        ticks: { 
                            color: '#848e9c', 
                            autoSkip: false,
                            maxRotation: 0,
                            callback: function(value, index, ticks) {
                                const labelFull = this.getLabelForValue(value);
                                if (!labelFull) return '';
                                const partes = labelFull.split(' - ');
                                return partes[1] !== undefined ? partes[1] : labelFull;
                            }
                        },
                        title: { display: true, text: 'Horas (0 a 23)', color: '#848e9c' }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                }
            },
            plugins: [
                verticalLinePlugin,
                {
                    id: 'copyAxisYPlugin',
                    afterRender: (chart) => {
                        desenharEixoYFixo(chart);
                    }
                }
            ]
        });

        setTimeout(() => {
            centralizarNaHoraAtual();
        }, 150);
    }

    function desenharEixoYFixo(chart) {
        const axisCanvas = document.getElementById('axisYCanvas');
        if (!axisCanvas) return;
        const ctx = axisCanvas.getContext('2d');
        
        const yScale = chart.scales.y;
        if (!yScale) return;

        axisCanvas.width = 50;
        axisCanvas.height = chart.height;

        ctx.clearRect(0, 0, axisCanvas.width, axisCanvas.height);
        
        ctx.save();
        ctx.fillStyle = '#848e9c';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        ctx.translate(12, chart.chartArea.top + (chart.chartArea.height / 2));
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('Metros', 0, 0);
        ctx.restore();

        ctx.fillStyle = '#848e9c';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';

        yScale.ticks.forEach((tick, index) => {
            const yPixel = yScale.getPixelForTick(index);
            if (yPixel >= chart.chartArea.top && yPixel <= chart.chartArea.bottom) {
                ctx.fillText(tick.value.toFixed(1) + 'm', 44, yPixel);
            }
        });
    }

    function mostrarLoader(t) {
        document.getElementById('loadingText').textContent = t;
        document.getElementById('loadingOverlay').style.display = 'flex';
    }
    function esconderLoader() {
        document.getElementById('loadingOverlay').style.display = 'none';
    }
</script>
